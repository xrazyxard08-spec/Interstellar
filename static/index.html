<!-- TARGETED POPUP / POPUNDER BLOCKER -->
<script>
  (function() {
    // =========================================================================
    // ADD YOUR SPECIFIC DOMAINS/URLS TO BLOCK IN THIS ARRAY
    // =========================================================================
    const BLOCKED_DOMAINS = [
      "https://undercoverhiking.com/cn4ai6dv?key=4d729d45e2fde8ef6d2caccfe564d6be",
      "popunder.xyz",
      "redirect-link.net"
    ];

    // Helper function to check if a URL contains any blocked domain
    function isBlocked(url) {
      if (!url || typeof url !== "string") return false;
      return BLOCKED_DOMAINS.some(domain => url.toLowerCase().includes(domain.toLowerCase()));
    }

    // 1. Intercept window.open calls targeting specific domains
    const originalOpen = window.open;
    window.open = function(url, target, features) {
      if (isBlocked(url)) {
        console.log("Blocked targeted popup opening attempt:", url);
        return null;
      }
      // Allow legitimate non-blocked popups
      return originalOpen.apply(this, arguments);
    };

    // 2. Intercept click event listeners on links/elements pointing to blocked domains
    document.addEventListener("click", function(e) {
      let target = e.target;
      while (target && target !== document) {
        const href = target.href || "";
        const onclickAttr = target.getAttribute && target.getAttribute("onclick") || "";

        if (isBlocked(href) || isBlocked(onclickAttr)) {
          e.preventDefault();
          e.stopPropagation();
          console.log("Blocked click redirect to targeted domain:", href || onclickAttr);
          break;
        }
        target = target.parentNode;
      }
    }, true);
  })();
</script>
