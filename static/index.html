  <!-- POPUP / POPUNDER BLOCKER -->
  <script>
    (function() {
      const BLOCKED_DOMAINS = [
        "undercoverhiking.com",
        "bad-ad-network.com",
        "popunder.xyz",
        "redirect-link.net"
      ];

      function isBlocked(url) {
        if (!url || typeof url !== "string") return false;
        return BLOCKED_DOMAINS.some(domain => url.toLowerCase().includes(domain.toLowerCase()));
      }

      const originalOpen = window.open;
      window.open = function(url, target, features) {
        if (isBlocked(url)) {
          console.log("Blocked popup redirect:", url);
          return null;
        }
        return originalOpen.apply(this, arguments);
      };

      document.addEventListener("click", function(e) {
        let target = e.target;
        while (target && target !== document) {
          const href = target.href || "";
          const onclickAttr = target.getAttribute && target.getAttribute("onclick") || "";

          if (isBlocked(href) || isBlocked(onclickAttr)) {
            e.preventDefault();
            e.stopPropagation();
            console.log("Blocked click redirect:", href || onclickAttr);
            break;
          }
          target = target.parentNode;
        }
      }, true);
    })();
  </script>

  <style>
    a[target="_blank"][style*="position: fixed"],
    a[target="_blank"][style*="position: absolute"] {

      pointer-events: none !important;

<body class="center" onload="SplashT">
  <!-- LOCKOUT BUTTON -->
  <button id="lock-button" onclick="lockOut()" style="position: fixed; top: 12px; right: 12px; z-index: 99998; display: none; background: #222; color: #fff; border: 1px solid #444; padding: 6px 12px; border-radius: 4px; font-size: 0.8rem; cursor: pointer;">
    Lock
  </button>

  <div class="nav-bar"></div>

    <h1 class="title">&#73;&#110;&#116;&#101;&#114;&#115;&#116;&#101;&#108;&#108;&#97;&#114;</h1>
    <p id="splash"></p>
    <div class="search-container">

  <!-- ULTRA-SIMPLE ACCESS GATE -->
  <div id="access-gate" style="position: fixed; inset: 0; background: #121212; display: flex; align-items: center; justify-content: center; z-index: 99999; font-family: system-ui, -apple-system, sans-serif; color: #ffffff;">
    <div style="width: 100%; max-width: 320px; padding: 24px; box-sizing: border-box; background: #1a1a1a; border: 1px solid #2a2a2a; border-radius: 6px;">
      <h2 style="margin: 0 0 16px 0; font-size: 1.1rem; font-weight: 500; text-align: center; color: #ffffff;">Enter Passcode</h2>

      <form onsubmit="event.preventDefault(); validateAccessCode();" style="display: flex; flex-direction: column; gap: 10px;">
        <div style="display: flex; align-items: center; background: #0f0f0f; border: 1px solid #333333; border-radius: 4px; overflow: hidden;">
          <input type="password" id="access-input" autocomplete="off" spellcheck="false" placeholder="Passcode" style="flex: 1; padding: 10px 12px; border: none; background: transparent; color: #ffffff; font-size: 0.95rem; outline: none;" />
          <button type="button" onclick="togglePasscodeVisibility()" style="background: none; border: none; padding: 0 10px; cursor: pointer; color: #777777;">
            <i id="eye-icon" class="fa-solid fa-eye"></i>
          </button>
        </div>

        <button type="submit" style="padding: 10px; background: #2563eb; color: #ffffff; border: none; border-radius: 4px; font-weight: 600; font-size: 0.9rem; cursor: pointer;">
          Submit
        </button>
      </form>

      <p id="access-error" style="color: #ef4444; font-size: 0.85rem; margin-top: 12px; margin-bottom: 0; text-align: center; display: none;">
        Incorrect passcode.
      </p>
    </div>
  </div>

  <script>
    function togglePasscodeVisibility() {
      const input = document.getElementById("access-input");
      const icon = document.getElementById("eye-icon");

      if (input.type === "password") {
        input.type = "text";
        icon.classList.remove("fa-eye");
        icon.classList.add("fa-eye-slash");
      } else {
        input.type = "password";
        icon.classList.remove("fa-eye-slash");
        icon.classList.add("fa-eye");
      }
    }

    function checkAccessCode() {
      const isAuth = sessionStorage.getItem("interstellar_authenticated");
      const accessGate = document.getElementById("access-gate");
      const lockBtn = document.getElementById("lock-button");

      if (isAuth === "true") {
        accessGate.style.display = "none";
        if (lockBtn) lockBtn.style.display = "block";
      } else {
        accessGate.style.display = "flex";
        if (lockBtn) lockBtn.style.display = "none";
      }
    }

    async function validateAccessCode() {
      const inputVal = document.getElementById("access-input").value;
      const errorEl = document.getElementById("access-error");

      try {
        const response = await fetch('/api/verify-access', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ code: inputVal })
        });

        const data = await response.json();

        if (response.ok && data.success) {
          sessionStorage.setItem("interstellar_authenticated", "true");
          checkAccessCode();
        } else {
          errorEl.textContent = data.message || "Incorrect passcode.";
          errorEl.style.display = "block";
        }
      } catch (err) {
        errorEl.textContent = "Server error. Try again.";
        errorEl.style.display = "block";
      }
    }

    function lockOut() {
      sessionStorage.removeItem("interstellar_authenticated");
      document.getElementById("access-input").value = "";
      checkAccessCode();
    }

    checkAccessCode();
  </script>
