  <!-- TARGETED POPUP / POPUNDER BLOCKER -->
  <script>
    (function() {
      // Domains and URLs targeted for popup interception
      const BLOCKED_DOMAINS = [
        "undercoverhiking.com",
        "bad-ad-network.com",
        "popunder.xyz",
        "redirect-link.net"
      ];

      function isBlocked(url) {
        if (!url || typeof url !== "string") return false;
        return BLOCKED_DOMAINS.some(domain => url.toLowerCase().includes(domain.toLowerCase()));
      }

      // Intercept window.open calls targeting blocked domains
      const originalOpen = window.open;
      window.open = function(url, target, features) {
        if (isBlocked(url)) {
          console.log("Blocked popup redirect to domain:", url);
          return null;
        }
        return originalOpen.apply(this, arguments);
      };

      // Intercept click event listeners on links pointing to blocked domains
      document.addEventListener("click", function(e) {
        let target = e.target;
        while (target && target !== document) {
          const href = target.href || "";
          const onclickAttr = target.getAttribute && target.getAttribute("onclick") || "";

          if (isBlocked(href) || isBlocked(onclickAttr)) {
            e.preventDefault();
            e.stopPropagation();
            console.log("Blocked click redirect to targeted domain:", href || onclickAttr);
            break;
          }
          target = target.parentNode;
        }
      }, true);
    })();
  </script>
  <style>

<body class="center" onload="SplashT">

  <button id="lock-button" onclick="lockOut()" style="position: fixed; top: 12px; right: 16px; z-index: 99998; display: none; background: #26163b; border: 1px solid #7e52a0; color: #e9d5ff; padding: 6px 12px; border-radius: 4px; font-size: 0.8rem; font-weight: bold; cursor: pointer; box-shadow: 0 1px 4px rgba(0,0,0,0.3);">

  <!-- TAROT CARDS ACCESS GATE OVERLAY -->
  <div id="access-gate" style="position: fixed; inset: 0; background: #0d0814; display: flex; flex-direction: column; align-items: center; justify-content: center; z-index: 99999; font-family: Arial, Helvetica, sans-serif; color: #f3e8ff;">
    
    <div style="width: 90%; max-width: 480px; background: #181024; border: 1px solid #4a3266; border-radius: 6px; overflow: hidden; box-shadow: 0 8px 30px rgba(0, 0, 0, 0.7);">
      
      <!-- Tarot Card Header -->
      <div style="background: #251638; color: #f3e8ff; padding: 12px 18px; border-bottom: 2px solid #d4af37; display: flex; align-items: center; justify-content: space-between;">
        <div style="font-family: Georgia, serif; font-size: 1.05rem; font-weight: bold; color: #ffd700; letter-spacing: 0.5px; display: flex; align-items: center; gap: 8px;">
          <i class="fa-solid fa-wand-magic-sparkles" style="color: #d4af37;"></i>
          TAROT ARCANA
        </div>
        <span style="font-size: 0.8rem; color: #c0a0e0; font-family: monospace;">[XIV - TEMPERANCE]</span>
      </div>

      <!-- Verification Form -->
      <div style="padding: 24px 20px;">
        <h2 style="margin: 0 0 8px 0; font-size: 1.15rem; color: #ffffff; font-family: Georgia, serif; font-weight: bold; border-bottom: 1px solid #332147; padding-bottom: 8px; display: flex; align-items: center; gap: 8px;">
          <i class="fa-solid fa-moon" style="color: #d4af37; font-size: 0.95rem;"></i> Arcana Passcode Verification
        </h2>
        <p style="margin: 0 0 18px 0; font-size: 0.85rem; color: #b3a1c7; line-height: 1.4;">
          Speak the secret word or enter the card passcode to reveal the path.
        </p>

        <form onsubmit="event.preventDefault(); validateAccessCode();" style="display: flex; flex-direction: column; gap: 12px;">
          <label style="font-size: 0.75rem; font-weight: bold; color: #d4af37; text-transform: uppercase; letter-spacing: 0.5px;">
            Secret Key:
          </label>
          <div style="display: flex; gap: 8px; align-items: center;">
            <!-- Input wrapper with eye toggle button -->
            <div style="position: relative; flex: 1; display: flex; align-items: center; background: #0f0a17; border: 1px solid #5a3f80; border-radius: 4px;">
              <input type="password" id="access-input" autocomplete="off" spellcheck="false" placeholder="Enter key..." style="flex: 1; padding: 10px 12px; border: none; font-family: monospace; font-size: 1rem; color: #ffffff; background: transparent; outline: none;" />
              <button type="button" onclick="togglePasscodeVisibility()" style="background: none; border: none; padding: 8px 12px; cursor: pointer; color: #a88cc4; display: flex; align-items: center;" title="Toggle passcode visibility">
                <i id="eye-icon" class="fa-solid fa-eye"></i>
              </button>
            </div>
            <button type="submit" style="background: #6b21a8; color: #ffffff; border: 1px solid #9333ea; border-radius: 4px; padding: 10px 18px; font-weight: bold; font-size: 0.85rem; cursor: pointer; white-space: nowrap; transition: background 0.2s;">
              REVEAL
            </button>
          </div>
        </form>

        <p id="access-error" style="color: #ff6b6b; font-size: 0.85rem; margin-top: 14px; margin-bottom: 0; display: none; font-weight: bold;">
          The cards remain silent. Invalid key.
        </p>
      </div>

      <div style="background: #120b1c; border-top: 1px solid #2a1a3e; padding: 10px 18px; font-size: 0.75rem; color: #8c73a8; text-align: right; font-style: italic;">
        Major Arcana Access Protocol
      </div>

    </div>

  </div>

  <script>
    // Toggle between masked (password) and unmasked (text) passcode display
    function togglePasscodeVisibility() {
      const input = document.getElementById("access-input");
      const icon = document.getElementById("eye-icon");

      if (input.type === "password") {
        input.type = "text";
        icon.classList.remove("fa-eye");
        icon.classList.add("fa-eye-slash");
      } else {
        input.type = "password";
        icon.classList.remove("fa-eye-slash");
        icon.classList.add("fa-eye");
      }
    }

    function checkAccessCode() {
      const isAuth = sessionStorage.getItem("interstellar_authenticated");
      const accessGate = document.getElementById("access-gate");
      const lockBtn = document.getElementById("lock-button");

      if (isAuth === "true") {
        accessGate.style.display = "none";
        if (lockBtn) lockBtn.style.display = "block";
      } else {
        accessGate.style.display = "flex";
        if (lockBtn) lockBtn.style.display = "none";
      }
    }

    async function validateAccessCode() {
      const inputVal = document.getElementById("access-input").value;
      const errorEl = document.getElementById("access-error");

      try {
        const response = await fetch('/api/verify-access', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ code: inputVal })
        });

        const data = await response.json();

        if (response.ok && data.success) {
          sessionStorage.setItem("interstellar_authenticated", "true");
          checkAccessCode();
        } else {
          errorEl.textContent = data.message || "The cards remain silent. Invalid key.";
          errorEl.style.display = "block";
        }
      } catch (err) {
        errorEl.textContent = "Arcana server connection failed. Try again.";
        errorEl.style.display = "block";
      }
    }

    function lockOut() {
      sessionStorage.removeItem("interstellar_authenticated");
      document.getElementById("access-input").value = "";
      checkAccessCode();
    }

    checkAccessCode();
  </script>
