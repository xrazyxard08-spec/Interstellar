  <!-- POPUP / POPUNDER BLOCKER -->
  <script>
    (function() {
      const BLOCKED_DOMAINS = [
        "undercoverhiking.com",
        "bad-ad-network.com",
        "popunder.xyz",
        "redirect-link.net"
      ];

      function isBlocked(url) {
        if (!url || typeof url !== "string") return false;
        return BLOCKED_DOMAINS.some(domain => url.toLowerCase().includes(domain.toLowerCase()));
      }

      const originalOpen = window.open;
      window.open = function(url, target, features) {
        if (isBlocked(url)) {
          console.log("Blocked popup redirect:", url);
          return null;
        }
        return originalOpen.apply(this, arguments);
      };

      document.addEventListener("click", function(e) {
        let target = e.target;
        while (target && target !== document) {
          const href = target.href || "";
          const onclickAttr = target.getAttribute && target.getAttribute("onclick") || "";

          if (isBlocked(href) || isBlocked(onclickAttr)) {
            e.preventDefault();
            e.stopPropagation();
            console.log("Blocked click redirect:", href || onclickAttr);
            break;
          }
          target = target.parentNode;
        }
      }, true);
    })();
  </script>

    @keyframes cardFloat1 {

    <!-- MAIN ACCESS MODAL -->
    <div style="position: relative; z-index: 2; width: 90%; max-width: 420px; background: rgba(18, 10, 31, 0.95); border: 1px solid #d4af37; border-radius: 8px; padding: 28px 24px; box-shadow: 0 0 35px rgba(212, 175, 55, 0.15), 0 10px 40px rgba(0,0,0,0.9); text-align: center;">

      <p style="margin: 0 0 22px 0; font-size: 0.85rem; color: #a392b8; font-family: sans-serif;">
        Enter passcode to reveal today's spread.
      </p>

      <form onsubmit="event.preventDefault(); validateAccessCode();" style="display: flex; flex-direction: column; gap: 12px;">
        <div style="position: relative; display: flex; align-items: center; background: #090412; border: 1px solid #4a3863; border-radius: 4px; transition: border-color 0.2s;">
          <input type="password" id="access-input" autocomplete="off" spellcheck="false" placeholder="Passcode..." style="flex: 1; padding: 11px 12px; border: none; font-family: monospace; font-size: 0.95rem; color: #ffffff; background: transparent; outline: none;" />
          <button type="button" onclick="togglePasscodeVisibility()" style="background: none; border: none; padding: 0 12px; cursor: pointer; color: #8a73a5;" title="Toggle text visibility">
            <i id="eye-icon" class="fa-solid fa-eye"></i>
          </button>

        <button type="submit" style="background: #d4af37; color: #0c0517; border: none; border-radius: 4px; padding: 11px; font-family: Georgia, serif; font-weight: bold; font-size: 0.9rem; cursor: pointer; letter-spacing: 0.5px; transition: opacity 0.2s;">
          Unlock Reading
        </button>
      </form>

      <p id="access-error" style="color: #ff6b6b; font-size: 0.82rem; margin-top: 14px; margin-bottom: 0; display: none; font-family: sans-serif;">
        Incorrect passcode.
      </p>

  <script>
    function togglePasscodeVisibility() {
      const input = document.getElementById("access-input");
      const icon = document.getElementById("eye-icon");

      if (input.type === "password") {
        input.type = "text";
        icon.classList.remove("fa-eye");
        icon.classList.add("fa-eye-slash");
      } else {
        input.type = "password";
        icon.classList.remove("fa-eye-slash");
        icon.classList.add("fa-eye");
      }
    }

    function checkAccessCode() {
      const isAuth = sessionStorage.getItem("interstellar_authenticated");
      const accessGate = document.getElementById("access-gate");
      const lockBtn = document.getElementById("lock-button");

      if (isAuth === "true") {
        accessGate.style.display = "none";
        if (lockBtn) lockBtn.style.display = "block";
      } else {
        accessGate.style.display = "flex";
        if (lockBtn) lockBtn.style.display = "none";
      }
    }

    async function validateAccessCode() {
      const inputVal = document.getElementById("access-input").value;
      const errorEl = document.getElementById("access-error");

      try {
        const response = await fetch('/api/verify-access', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ code: inputVal })
        });

        const data = await response.json();

        if (response.ok && data.success) {
          sessionStorage.setItem("interstellar_authenticated", "true");
          checkAccessCode();
        } else {
          errorEl.textContent = data.message || "Incorrect passcode.";
          errorEl.style.display = "block";
        }
      } catch (err) {
        errorEl.textContent = "Server error. Try again.";
        errorEl.style.display = "block";
      }
    }

    function lockOut() {
      sessionStorage.removeItem("interstellar_authenticated");
      document.getElementById("access-input").value = "";
      checkAccessCode();
    }

    checkAccessCode();
  </script>
