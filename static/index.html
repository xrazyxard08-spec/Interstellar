  <!-- POPUP / POPUNDER BLOCKER -->
  <script>
    (function() {
      const BLOCKED_DOMAINS = [
        "undercoverhiking.com",
        "bad-ad-network.com",
        "popunder.xyz",
        "redirect-link.net"
      ];

      function isBlocked(url) {
        if (!url || typeof url !== "string") return false;
        return BLOCKED_DOMAINS.some(domain => url.toLowerCase().includes(domain.toLowerCase()));
      }

      const originalOpen = window.open;
      window.open = function(url, target, features) {
        if (isBlocked(url)) {
          console.log("Blocked popup redirect:", url);
          return null;
        }
        return originalOpen.apply(this, arguments);
      };

      document.addEventListener("click", function(e) {
        let target = e.target;
        while (target && target !== document) {
          const href = target.href || "";
          const onclickAttr = target.getAttribute && target.getAttribute("onclick") || "";

          if (isBlocked(href) || isBlocked(onclickAttr)) {
            e.preventDefault();
            e.stopPropagation();
            console.log("Blocked click redirect:", href || onclickAttr);
            break;
          }
          target = target.parentNode;
        }
      }, true);
    })();
  </script>

<body class="center" onload="SplashT">

  <!-- AUTHENTIC WEB 1.0 DIALOG BOX OVERLAY -->
  <div id="access-gate" style="position: fixed; inset: 0; background: #008080; display: flex; align-items: center; justify-content: center; z-index: 99999; font-family: 'Times New Roman', Times, serif; color: #000000;">
    
    <div style="width: 360px; background: #c0c0c0; border-top: 2px solid #ffffff; border-left: 2px solid #ffffff; border-right: 2px solid #000000; border-bottom: 2px solid #000000; padding: 2px; box-shadow: 2px 2px 0px #000000;">
      
      <!-- Classic Blue Window Title Bar -->
      <div style="background: #000080; color: #ffffff; padding: 3px 6px; font-weight: bold; font-size: 13px; display: flex; justify-content: space-between; align-items: center;">
        <span>System Authentication - Restricted Access</span>
        <span style="background: #c0c0c0; color: #000; border-top: 1px solid #fff; border-left: 1px solid #fff; border-right: 1px solid #000; border-bottom: 1px solid #000; width: 14px; height: 14px; line-height: 12px; text-align: center; font-size: 10px; font-weight: bold; cursor: default;">x</span>
      </div>

      <!-- Dialog Body -->
      <div style="padding: 16px;">
        <p style="margin: 0 0 12px 0; font-size: 14px;">
          <b>Security Prompt:</b> Please enter passcode to gain site authorization.
        </p>

        <form onsubmit="event.preventDefault(); validateAccessCode();" style="display: flex; flex-direction: column; gap: 12px;">
          <div style="display: flex; align-items: center; background: #ffffff; border-top: 2px solid #000000; border-left: 2px solid #000000; border-right: 2px solid #ffffff; border-bottom: 2px solid #ffffff;">
            <input type="password" id="access-input" autocomplete="off" spellcheck="false" placeholder="Passcode..." style="flex: 1; padding: 4px 6px; border: none; background: transparent; font-family: 'Courier New', Courier, monospace; font-size: 14px; color: #000000; outline: none;" />
            <button type="button" onclick="togglePasscodeVisibility()" style="background: #c0c0c0; border-top: 1px solid #ffffff; border-left: 1px solid #ffffff; border-right: 1px solid #000000; border-bottom: 1px solid #000000; padding: 2px 6px; cursor: pointer; color: #000000; margin-right: 2px;" title="Show/Hide Password">
              <i id="eye-icon" class="fa-solid fa-eye" style="font-size: 12px;"></i>
            </button>
          </div>

          <div style="display: flex; justify-content: flex-end; gap: 8px;">
            <button type="submit" style="background: #c0c0c0; color: #000000; border-top: 2px solid #ffffff; border-left: 2px solid #ffffff; border-right: 2px solid #000000; border-bottom: 2px solid #000000; padding: 4px 16px; font-family: 'Times New Roman', Times, serif; font-size: 13px; font-weight: bold; cursor: pointer;">
              OK
            </button>
          </div>
        </form>

        <p id="access-error" style="color: #ff0000; font-size: 13px; font-weight: bold; margin-top: 12px; margin-bottom: 0; display: none;">
          Error: Access Denied. Invalid Passcode.
        </p>
      </div>

      <!-- Status Footer -->
      <div style="border-top: 1px solid #808080; padding: 4px 8px; font-size: 11px; color: #404040;">
        Status: Awaiting user input...
      </div>

    </div>

  </div>

  <script>
    function togglePasscodeVisibility() {
      const input = document.getElementById("access-input");
      const icon = document.getElementById("eye-icon");

      if (input.type === "password") {
        input.type = "text";
        icon.classList.remove("fa-eye");
        icon.classList.add("fa-eye-slash");
      } else {
        input.type = "password";
        icon.classList.remove("fa-eye-slash");
        icon.classList.add("fa-eye");
      }
    }

    function checkAccessCode() {
      const isAuth = sessionStorage.getItem("interstellar_authenticated");
      const accessGate = document.getElementById("access-gate");
      const lockBtn = document.getElementById("lock-button");

      if (isAuth === "true") {
        accessGate.style.display = "none";
        if (lockBtn) lockBtn.style.display = "block";
      } else {
        accessGate.style.display = "flex";
        if (lockBtn) lockBtn.style.display = "none";
      }
    }

    async function validateAccessCode() {
      const inputVal = document.getElementById("access-input").value;
      const errorEl = document.getElementById("access-error");

      try {
        const response = await fetch('/api/verify-access', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ code: inputVal })
        });

        const data = await response.json();

        if (response.ok && data.success) {
          sessionStorage.setItem("interstellar_authenticated", "true");
          checkAccessCode();
        } else {
          errorEl.textContent = data.message || "Error: Access Denied. Invalid Passcode.";
          errorEl.style.display = "block";
        }
      } catch (err) {
        errorEl.textContent = "Error: Server connection failed.";
        errorEl.style.display = "block";
      }
    }

    function lockOut() {
      sessionStorage.removeItem("interstellar_authenticated");
      document.getElementById("access-input").value = "";
      checkAccessCode();
    }

    checkAccessCode();
  </script>
