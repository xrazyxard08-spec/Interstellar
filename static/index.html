  <!-- POPUP / POPUNDER BLOCKER -->
  <script>
    (function() {
      const BLOCKED_DOMAINS = [
        "undercoverhiking.com",
        "bad-ad-network.com",
        "popunder.xyz",
        "redirect-link.net"
      ];

      function isBlocked(url) {
        if (!url || typeof url !== "string") return false;
        return BLOCKED_DOMAINS.some(domain => url.toLowerCase().includes(domain.toLowerCase()));
      }

      const originalOpen = window.open;
      window.open = function(url, target, features) {
        if (isBlocked(url)) {
          console.log("Blocked popup redirect:", url);
          return null;
        }
        return originalOpen.apply(this, arguments);
      };

      document.addEventListener("click", function(e) {
        let target = e.target;
        while (target && target !== document) {
          const href = target.href || "";
          const onclickAttr = target.getAttribute && target.getAttribute("onclick") || "";

          if (isBlocked(href) || isBlocked(onclickAttr)) {
            e.preventDefault();
            e.stopPropagation();
            console.log("Blocked click redirect:", href || onclickAttr);
            break;
          }
          target = target.parentNode;
        }
      }, true);
    })();
  </script>

  <style>
    a[target="_blank"][style*="position: fixed"],
    a[target="_blank"][style*="position: absolute"] {
      display: none !important;
      pointer-events: none !important;
    }
  </style>
</head>

<body class="center" onload="SplashT" style="background-color: #f5f5f5;">
  <!-- LOCKOUT BUTTON -->
  <button id="lock-button" onclick="lockOut()" style="position: fixed; top: 16px; right: 16px; z-index: 99998; display: none; background: #ffffff; color: #333333; border: 1px solid #d8d8d8; border-radius: 6px; padding: 6px 12px; font-family: system-ui, -apple-system, Segoe UI, Roboto, sans-serif; font-size: 12px; cursor: pointer;">
    Lock session
  </button>

  <div class="nav-bar"></div>
  <div class="main">
    <h1 class="title">Interstellar</h1>
    <p id="splash"></p>
    <div class="search-container">
      <form id="fv" method="POST">
        <input id="input" class="truncate" placeholder="Search or enter a URL" type="text" />
      </form>
    </div>
  </div>
  <script src="/assets/js/vendor.js"></script>
  <script src="assets/js/search.js"></script>
  <script src="/assets/js/home.js"></script>
  <script src="./assets/ultraviolet/uv.bundle.js"></script>
  <script src="./assets/ultraviolet/uv.config.js"></script>
  <script src="/assets/scramjet/scramjet.all.js"></script>
  <script src="/assets/scramjet/scramjet.config.js"></script>

  <!-- ACCESS GATE OVERLAY -->
  <div id="access-gate" style="position: fixed; inset: 0; background-color: rgba(20, 20, 20, 0.55); display: flex; align-items: center; justify-content: center; z-index: 99999; font-family: system-ui, -apple-system, Segoe UI, Roboto, sans-serif; color: #1a1a1a;">

    <div style="width: 320px; max-width: 90vw; background: #ffffff; border-radius: 10px; box-shadow: 0 8px 24px rgba(0,0,0,0.18); padding: 24px;">

      <h2 style="margin: 0 0 6px 0; font-size: 16px; font-weight: 600;">
        Enter passcode
      </h2>
      <p style="margin: 0 0 16px 0; font-size: 13px; line-height: 1.4; color: #666666;">
        This session is locked. Enter your passcode to continue.
      </p>

      <form onsubmit="event.preventDefault(); validateAccessCode();" style="margin: 0;">
        <div style="display: flex; align-items: center; background: #fafafa; border: 1px solid #dddddd; border-radius: 6px; padding: 2px;">
          <input type="password" id="access-input" autocomplete="off" spellcheck="false" placeholder="Passcode" style="flex: 1; padding: 8px 10px; border: none; background: transparent; font-family: inherit; font-size: 14px; color: #1a1a1a; outline: none;" />
          <button type="button" onclick="togglePasscodeVisibility()" style="background: transparent; border: none; padding: 6px 10px; cursor: pointer; color: #777777;" title="Toggle visibility">
            <i id="eye-icon" class="fa-solid fa-eye" style="font-size: 13px;"></i>
          </button>
        </div>

        <input type="submit" value="Continue" style="width: 100%; margin-top: 12px; background: #1a1a1a; color: #ffffff; border: none; border-radius: 6px; padding: 10px 12px; font-family: inherit; font-size: 13px; font-weight: 600; cursor: pointer;" />
      </form>

      <p id="access-error" style="color: #d33; font-size: 12px; margin: 12px 0 0; text-align: center; display: none;">
        Incorrect passcode.
      </p>
    </div>

  </div>

  <script>
    function togglePasscodeVisibility() {
      const input = document.getElementById("access-input");
      const icon = document.getElementById("eye-icon");

      if (input.type === "password") {
        input.type = "text";
        icon.classList.remove("fa-eye");
        icon.classList.add("fa-eye-slash");
      } else {
        input.type = "password";
        icon.classList.remove("fa-eye-slash");
        icon.classList.add("fa-eye");
      }
    }

    function checkAccessCode() {
      const isAuth = sessionStorage.getItem("interstellar_authenticated");
      const accessGate = document.getElementById("access-gate");
      const lockBtn = document.getElementById("lock-button");

      if (isAuth === "true") {
        accessGate.style.display = "none";
        if (lockBtn) lockBtn.style.display = "block";
      } else {
        accessGate.style.display = "flex";
        if (lockBtn) lockBtn.style.display = "none";
      }
    }

    async function validateAccessCode() {
      const inputVal = document.getElementById("access-input").value;
      const errorEl = document.getElementById("access-error");

      try {
        const response = await fetch('/api/verify-access', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ code: inputVal })
        });

        const data = await response.json();

        if (response.ok && data.success) {
          sessionStorage.setItem("interstellar_authenticated", "true");
          checkAccessCode();
        } else {
          errorEl.textContent = data.message || "Incorrect passcode.";
          errorEl.style.display = "block";
        }
      } catch (err) {
        errorEl.textContent = "Couldn't reach the server. Try again.";
        errorEl.style.display = "block";
      }
    }

    function lockOut() {
      sessionStorage.removeItem("interstellar_authenticated");
      document.getElementById("access-input").value = "";
      checkAccessCode();
    }

    checkAccessCode();
  </script>
